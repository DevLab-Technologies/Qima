name: Play Store

# Tag-driven: `git tag android-v1.0.0 && git push origin android-v1.0.0` builds
# a signed App Bundle and uploads it to the Play internal track via the Google
# Play Developer API. Manual runs (workflow_dispatch) build and verify the same
# bundle without uploading, so a misconfigured secret fails privately on a run
# instead of publicly on a tag. Mirrors testflight.yml's shape.
#
# Promotion from internal to closed/production testing, and submission for
# review, stay manual in Play Console.
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

# Keep in step with ci.yml / release.yml / testflight.yml.
env:
  FLUTTER_VERSION: "3.41.6"

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build (and upload on tag push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail before spending any build time if a secret is absent. The Play key
      # is only needed to upload, so manual validation runs don't require it.
      - name: Verify required secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          required="ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD"
          if [ "$IS_TAG" = "true" ]; then
            required="$required PLAY_SERVICE_ACCOUNT_JSON"
          fi
          missing=""
          for name in $required; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      # pubspec.yaml is the single source of truth for the version name, same
      # convention as release.yml. Only enforced on a real tag push.
      - name: Verify tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pubspec_version="$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          tag_version="${GITHUB_REF_NAME#android-v}"
          tag_version="${tag_version%%+*}"
          if [ "$pubspec_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $pubspec_version."
            echo 'Bump the version: line in pubspec.yaml and retag.'
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Flutter dependencies
        run: flutter pub get

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/qima-release.jks"

      # The versionCode is derived inside the `internal` lane from the highest
      # code already on Play, so it is not passed in here for uploads.
      - name: Build, sign, and (on tag push) upload to the Play internal track
        working-directory: android
        env:
          QIMA_KEYSTORE_PATH: ${{ runner.temp }}/qima-release.jks
          QIMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QIMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QIMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
          QIMA_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            bundle exec fastlane android internal
          else
            bundle exec fastlane android build_only
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/qima-release.jks"

      # Manual runs publish the signed bundle so it can be uploaded to Play
      # Console by hand - required for a new app's very first release, before
      # the Play Developer API accepts uploads. Short retention: it is a
      # release artifact, not something to keep around.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: qima-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qima-android-build-logs
          path: android/fastlane/report.xml
          if-no-files-found: ignore
