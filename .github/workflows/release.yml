name: Release

# Tag-driven: `git tag v1.0.0 && git push origin v1.0.0` builds a signed APK and
# publishes it as a GitHub Release. Manual runs build and verify the same
# artifact without publishing, which is the safe way to test changes here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Keep in step with ci.yml.
env:
  FLUTTER_VERSION: "3.41.6"

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # pubspec.yaml is the single source of truth for the version. A tag that
      # disagrees with it would publish an asset whose in-app version differs
      # from its release name, so fail loudly instead.
      - name: Verify tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pubspec_version="$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pubspec_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $pubspec_version."
            echo 'Bump the version: line in pubspec.yaml (both the name and the +buildNumber) and retag.'
            exit 1
          fi

      # Fail before building rather than silently shipping a debug-signed APK:
      # build.gradle.kts falls back to the debug key when signing material is
      # missing, which is correct for contributors but must never reach a release.
      - name: Verify release signing secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing release signing secrets:$missing - a release APK must not be debug-signed."
            exit 1
          fi

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/qima-release.jks"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          QIMA_KEYSTORE_PATH: ${{ runner.temp }}/qima-release.jks
          QIMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QIMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QIMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      # Confirms the APK carries the release certificate and not the debug one.
      # The debug key is always CN=Android Debug, so its presence here means the
      # signing configuration silently fell back.
      - name: Verify APK signature
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          signer_output="$("$build_tools/apksigner" verify --print-certs "$apk")"
          echo "$signer_output"
          if echo "$signer_output" | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the debug key. Refusing to publish."
            exit 1
          fi

      - name: Prepare release assets
        run: |
          version="$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/qima-${version}.apk"
          cd dist
          sha256sum "qima-${version}.apk" > "qima-${version}.apk.sha256"
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: qima-android-apk
          path: dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Qima $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
