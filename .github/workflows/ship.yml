name: Ship

# Two stages, one version (pubspec.yaml's `version: <name>+<build>`):
#
# develop -> testers. Every push builds the NEXT build of the current version
#   (2.1.1+1, 2.1.1+2, ... - nobody bumps the build by hand), tags the commit
#   v<version>+<build>, and uploads it:
#     iOS and macOS    -> TestFlight              (testflight*.yml)
#     Android          -> Play internal testing   (play-store.yml)
#     APK, macOS, Windows, Linux -> this run's artifacts, not published
#
# main -> public. Merging develop releases the LAST TESTED build of that
#   version, without rebuilding it for the stores:
#     iOS and macOS    -> submitted for App Review (released by hand once approved)
#     Android          -> promoted from internal testing to production
#     APK, macOS, Windows, Linux -> the public GitHub Release, under that tag
#   A version is released once; pushes to main after that do nothing until
#   the version in pubspec.yaml changes and a new build of it is tested.
#
# A manual run builds every platform without uploading anything.
on:
  push:
    branches: [develop, main]
    # Store text, screenshots and docs don't change the app: a push of only
    # those doesn't spend a build number. The listing goes up with the next
    # release from main.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "ios/fastlane/metadata/**"
      - "ios/fastlane/screenshots/**"
      - "android/fastlane/metadata/**"
  workflow_dispatch:

# One ship per branch at a time, queued rather than cancelled: a cancelled
# upload can leave a store half-updated, and the next build number is read
# from tags, so two runs at once could pick the same one.
concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Decide what to ship
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      stage: ${{ steps.decide.outputs.stage }}
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and pick the build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          full="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          if ! [[ "$full" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::pubspec.yaml's version must look like 2.1.1+1 (got '$full')."
            exit 1
          fi
          version="${full%%+*}"
          pubspec_build="${full#*+}"

          # Highest build of this version already tagged, by any workflow
          # (v…, ios-v…, macos-v…, android-v…); 0 when none.
          last_build="$(git ls-remote --tags --refs origin \
            | sed -nE "s#.*refs/tags/([a-z]+-)?v${version//./\\.}\+([0-9]+)\$#\2#p" \
            | sort -n | tail -1)"
          last_build="${last_build:-0}"

          stage=skip
          build=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            stage=dry-run
            build="$pubspec_build"
          elif [ "$BRANCH" = "develop" ]; then
            stage=beta
            build=$(( last_build + 1 > pubspec_build ? last_build + 1 : pubspec_build ))
            tag="v$version+$build"
            # Tags pushed with the workflow token never start workflow runs,
            # so this can't trigger another ship.
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          elif [ "$BRANCH" = "main" ]; then
            if [ "$last_build" = "0" ]; then
              echo "::notice::No build of $version has been tested yet; push to develop first. Nothing released."
            elif gh release view "v$version+$last_build" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::notice::$version build $last_build is already released. Nothing to do."
            else
              stage=release
              build="$last_build"
            fi
          fi

          {
            echo "stage=$stage"
            echo "version=$version"
            echo "build=$build"
            echo "tag=v$version+$build"
          } >> "$GITHUB_OUTPUT"
          echo "Stage: $stage, $version build ${build:-none}"

  # ---- develop: build and upload for testers (manual runs: build only) ----

  ios:
    name: iOS to TestFlight
    needs: prepare
    if: contains(fromJSON('["beta", "dry-run"]'), needs.prepare.outputs.stage)
    uses: ./.github/workflows/testflight.yml
    with:
      publish: ${{ needs.prepare.outputs.stage == 'beta' }}
      build_number: ${{ needs.prepare.outputs.build }}
    secrets: inherit

  macos:
    name: macOS to TestFlight
    needs: prepare
    if: contains(fromJSON('["beta", "dry-run"]'), needs.prepare.outputs.stage)
    uses: ./.github/workflows/testflight-macos.yml
    with:
      publish: ${{ needs.prepare.outputs.stage == 'beta' }}
      build_number: ${{ needs.prepare.outputs.build }}
    secrets: inherit

  android:
    name: Android to Play internal testing
    needs: prepare
    if: contains(fromJSON('["beta", "dry-run"]'), needs.prepare.outputs.stage)
    uses: ./.github/workflows/play-store.yml
    with:
      publish: ${{ needs.prepare.outputs.stage == 'beta' }}
      build_number: ${{ needs.prepare.outputs.build }}
    secrets: inherit

  # Beta and dry runs build the downloads as run artifacts only; main
  # publishes them. Same workflow either way, so a tested build is exactly
  # what gets released.
  downloads:
    name: Downloads (APK, macOS, Windows, Linux)
    needs: prepare
    if: needs.prepare.outputs.stage != 'skip'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      publish: ${{ needs.prepare.outputs.stage == 'release' }}
      tag: ${{ needs.prepare.outputs.tag }}
      build_number: ${{ needs.prepare.outputs.build }}
    secrets: inherit

  # ---- main: release the tested build to the public ----

  submit-ios:
    name: iOS to App Review
    needs: prepare
    if: needs.prepare.outputs.stage == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios
      - name: Submit the tested build with the listing
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          QIMA_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
        run: bundle exec fastlane ios release

  submit-macos:
    name: macOS to App Review
    needs: prepare
    if: needs.prepare.outputs.stage == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios
      - name: Submit the tested build
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          QIMA_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
        run: bundle exec fastlane mac release

  promote-android:
    name: Android to production
    needs: prepare
    if: needs.prepare.outputs.stage == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android
      - name: Promote the tested build
        working-directory: android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
          QIMA_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
        run: bundle exec fastlane android production
