name: TestFlight (macOS)

# Tag-driven: `git tag macos-v2.0.0 && git push origin macos-v2.0.0` builds
# the Mac App Store installer package and uploads it to TestFlight via the
# App Store Connect API. Manual runs (workflow_dispatch) build and sign the
# same package without uploading. Mirrors testflight.yml (iOS).
on:
  push:
    tags: ["macos-v*"]
  workflow_dispatch:

# Keep in step with ci.yml / release.yml / testflight.yml.
env:
  FLUTTER_VERSION: "3.41.6"

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build (and upload on tag push)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets are present
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          MAC_INSTALLER_CERT_BASE64: ${{ secrets.MAC_INSTALLER_CERT_BASE64 }}
          MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          MACOS_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
          MACOS_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_WIDGET_PROVISION_PROFILE_BASE64 }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT IOS_DIST_CERT_BASE64 IOS_DIST_CERT_PASSWORD MAC_INSTALLER_CERT_BASE64 MAC_INSTALLER_CERT_PASSWORD MACOS_PROVISION_PROFILE_BASE64 MACOS_WIDGET_PROVISION_PROFILE_BASE64; do
            value="$(eval echo "\$$name")"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      - name: Verify tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pubspec_version="$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          tag_version="${GITHUB_REF_NAME#macos-v}"
          tag_version="${tag_version%%+*}"
          if [ "$pubspec_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $pubspec_version."
            echo 'Bump the version: line in pubspec.yaml and retag.'
            exit 1
          fi

      # App Store Connect requires the current SDKs for Mac uploads too.
      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Install Flutter dependencies
        run: flutter pub get

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      # Build numbers must strictly increase per TestFlight upload, per
      # platform; this workflow's run number does, without an API call.
      - name: Determine build number
        id: build_number
        run: echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build, sign, and (on tag push) upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          MAC_INSTALLER_CERT_BASE64: ${{ secrets.MAC_INSTALLER_CERT_BASE64 }}
          MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          MACOS_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
          MACOS_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_WIDGET_PROVISION_PROFILE_BASE64 }}
          QIMA_BUILD_NUMBER: ${{ steps.build_number.outputs.number }}
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            bundle exec fastlane mac beta
          else
            bundle exec fastlane mac build_only
          fi
