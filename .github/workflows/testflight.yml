name: TestFlight

# Tag-driven: `git tag ios-v1.0.0+1 && git push origin ios-v1.0.0+1` builds a
# signed IPA and uploads it to TestFlight via the App Store Connect API.
# Manual runs (workflow_dispatch) build and code-sign the same artifact
# without uploading, so a misconfigured secret fails privately on a run
# instead of publicly on a tag. Mirrors release.yml's shape.
on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:

# Keep in step with ci.yml / release.yml.
env:
  FLUTTER_VERSION: "3.41.6"

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build (and upload on tag push)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Fail before spending any build time if a signing secret is absent,
      # rather than failing deep inside fastlane with a confusing error.
      - name: Verify required secrets are present
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISION_PROFILE_BASE64 }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT IOS_DIST_CERT_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISION_PROFILE_BASE64 IOS_WIDGET_PROVISION_PROFILE_BASE64; do
            value="$(eval echo "\$$name")"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi

      # pubspec.yaml is the single source of truth for the version name, same
      # convention as release.yml. Only enforced on a real tag push.
      - name: Verify tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pubspec_version="$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          tag_version="${GITHUB_REF_NAME#ios-v}"
          tag_version="${tag_version%%+*}"
          if [ "$pubspec_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $pubspec_version."
            echo 'Bump the version: line in pubspec.yaml and retag.'
            exit 1
          fi

      # The runner's default Xcode was 16.4 (iOS 18.5 SDK) and App Store Connect
      # now rejects anything built with less than the iOS 26 SDK. Select the
      # newest Xcode the image actually carries, and print the list so a future
      # image change is visible in the log rather than a 409 from altool.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Plugins resolve through Swift Package Manager (app_settings ships no
      # podspec), matching the committed Xcode project.
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Install Flutter dependencies
        run: flutter pub get

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      # CocoaPods comes from the ios/ bundle, not the machine: fastlane runs
      # under `bundle exec` and constrains the gem environment for everything it
      # spawns, so a globally installed pod is invisible to `flutter build ipa`.
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: bundle exec pod install --repo-update

      # Build numbers must strictly increase per TestFlight upload. The CI run
      # number is monotonically increasing for this workflow and needs no API
      # call, so it's the default; override with QIMA_BUILD_NUMBER if you'd
      # rather derive it from `latest_testflight_build_number + 1`.
      - name: Determine build number
        id: build_number
        run: echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build, sign, and (on tag push) upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISION_PROFILE_BASE64 }}
          QIMA_BUILD_NUMBER: ${{ steps.build_number.outputs.number }}
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            bundle exec fastlane ios beta
          else
            bundle exec fastlane ios build_only
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qima-ios-build-logs
          path: |
            ios/fastlane/report.xml
            build/ios/ipa/*.txt
          if-no-files-found: ignore
