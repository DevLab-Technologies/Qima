org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 defaults to built-in Kotlin and its new DSL. Several Flutter plugins
# (cryptography_flutter, file_selector_android, image_picker_android,
# local_auth_android) still apply kotlin-android themselves, and Flutter
# 3.41's Gradle plugin uses the old DSL, so both stay off until they move.
android.builtInKotlin=false
android.newDsl=false
