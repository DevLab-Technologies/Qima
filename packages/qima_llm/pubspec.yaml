name: qima_llm
description: "A small language model in a GGUF file, run on the CPU by llama.cpp, for Qima on Windows and Linux."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.11.4
  flutter: '>=3.41.0'

dependencies:
  ffi: ^2.1.4
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
